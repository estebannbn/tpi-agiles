sonar.sources=src
# 1. Le decimos a Sonar que 'steps' también son tests, no código de producción:
sonar.tests=tests,steps

# 2. Excluimos archivos de configuración que no llevan cobertura:
sonar.exclusions=node_modules/**,*.config.ts

# 3. Excluimos la UI del reporte de unit tests (se prueba con BDD):
sonar.coverage.exclusions=src/ui/**,src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info